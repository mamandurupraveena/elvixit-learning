<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TravelGo - Admin Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="admin-login-page">

        <div class="admin-login-card">

            <div class="logo">
                Travel<span>Go</span>
            </div>

            <h1>Admin Login</h1>

            <p>
                Login to manage TravelGo bookings.
            </p>


            <form id="adminLoginForm">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >


                <button
                    type="submit"
                    class="login-submit-btn"
                >
                    Login
                </button>

            </form>


            <p
                id="loginMessage"
                class="login-message"
            ></p>

            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </main>


    <script src="admin-login.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Book Your Trip - TravelGo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">

        <div class="logo">
            Travel<span>Go</span>
        </div>

        <nav>
            <a href="index.html#home">Home</a>
            <a href="index.html#destinations">Destinations</a>
            <a href="index.html#services">Services</a>
            <a href="index.html#contact">Contact</a>
        </nav>

    </header>


    <!-- Booking Section -->
    <main class="booking-page">

        <div class="booking-card">

            <h1>
                Book Your Trip ✈️
            </h1>

            <p>
                Fill in your details and we'll help
                you plan your trip.
            </p>


            <form id="bookingForm">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    Destination
                </label>

                <input
                    type="text"
                    id="bookingDestination"
                    readonly
                >


                <label>
                    Travel Date
                </label>

                <input
                    type="date"
                    id="travelDate"
                    required
                >


                <label>
                    Number of People
                </label>

                <input
                    type="number"
                    id="people"
                    min="1"
                    value="1"
                    required
                >


                <button
                    type="submit"
                    class="book-btn"
                >
                    Confirm Booking
                </button>

            </form>


            <p
                id="bookingMessage"
                class="booking-message"
            ></p>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="booking.js"></script>

</body>

</html>

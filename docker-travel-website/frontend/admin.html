<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TravelGo Admin</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #0d6efd;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .total-card {
            background: white;
            padding: 20px 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .total-card span {
            display: block;
            color: #666;
            margin-bottom: 5px;
        }

        .total-card strong {
            font-size: 28px;
            color: #0d6efd;
        }

        button {
            border: none;
            background: #0d6efd;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin: 2px;
        }

        button:hover {
            opacity: 0.9;
        }

        .delete-btn {
            background: #dc3545;
        }

        .edit-btn {
            background: #198754;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8f9fa;
        }

        .loading,
        .empty,
        .error {
            text-align: center;
            padding: 30px;
        }

        .error {
            color: #dc3545;
        }


        /* =========================
           EDIT MODAL
        ========================= */

        .modal {
            display: none;

            position: fixed;

            z-index: 1000;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: rgba(0,0,0,0.5);
        }

        .modal-content {

            background: white;

            width: 90%;

            max-width: 500px;

            margin: 5% auto;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .close {
            float: right;

            font-size: 30px;

            cursor: pointer;

            color: #777;
        }

        .modal-content label {

            display: block;

            margin-top: 12px;

            margin-bottom: 5px;

            font-weight: bold;
        }

        .modal-content input,
        .modal-content select {

            width: 100%;

            padding: 10px;

            border: 1px solid #ddd;

            border-radius: 6px;

            font-size: 15px;
        }

        .modal-buttons {

            display: flex;

            gap: 10px;

            margin-top: 20px;
        }

        .cancel-btn {
            background: #777;
        }


        @media (max-width: 700px) {

            header {
                padding: 15px 20px;
            }

            nav a {
                margin-left: 10px;
                font-size: 14px;
            }

            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        TravelGo
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#destinations">
            Destinations
        </a>

        <a href="index.html#services">
            Services
        </a>

    </nav>

</header>


<div class="container">

    <h1>
        TRAVELGO ADMIN
    </h1>

    <p class="subtitle">
        Booking Management — View and manage customer bookings.
    </p>


    <div class="top-bar">

        <div class="total-card">

            <span>
                Total Bookings
            </span>

            <strong id="totalBookings">
                0
            </strong>

        </div>


        <button onclick="loadBookings()">
            🔄 Refresh
        </button>

    </div>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Destination</th>

                    <th>Travel Date</th>

                    <th>People</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="bookingTableBody">

                <tr>

                    <td colspan="7" class="loading">

                        Loading bookings...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>



<!-- =========================
     EDIT BOOKING MODAL
========================= -->

<div id="editModal" class="modal">


    <div class="modal-content">


        <span
            class="close"
            onclick="closeEditModal()">

            &times;

        </span>


        <h2>
            Edit Booking
        </h2>


        <form id="editForm">


            <input
                type="hidden"
                id="editId">


            <label>
                Name
            </label>

            <input
                type="text"
                id="editName"
                required>


            <label>
                Email
            </label>

            <input
                type="email"
                id="editEmail"
                required>


            <label>
                Destination
            </label>

            <select
                id="editDestination"
                required>

                <option value="Kerala">
                    Kerala
                </option>

                <option value="Dubai">
                    Dubai
                </option>

                <option value="Paris">
                    Paris
                </option>

                <option value="Bali">
                    Bali
                </option>

            </select>


            <label>
                Travel Date
            </label>

            <input
                type="date"
                id="editTravelDate"
                required>


            <label>
                People
            </label>

            <input
                type="number"
                id="editPeople"
                min="1"
                required>


            <div class="modal-buttons">


                <button type="submit">

                    💾 Save Changes

                </button>


                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeEditModal()">

                    Cancel

                </button>


            </div>


        </form>

    </div>

</div>



<script>


const API_URL =
    "http://localhost:5000/api/bookings";


let currentBookings = [];



/* =========================
   LOAD BOOKINGS
========================= */

async function loadBookings() {


    const tableBody =
        document.getElementById(
            "bookingTableBody"
        );


    const totalBookings =
        document.getElementById(
            "totalBookings"
        );


    tableBody.innerHTML = `

        <tr>

            <td colspan="7" class="loading">

                Loading bookings...

            </td>

        </tr>

    `;


    try {


        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}`
            );

        }


        const data =
            await response.json();


        const bookings =
            Array.isArray(data)
                ? data
                : data.bookings || [];


        currentBookings =
            bookings;


        totalBookings.textContent =
            bookings.length;


        if (bookings.length === 0) {


            tableBody.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="empty">

                        No bookings found.

                    </td>

                </tr>

            `;

            return;

        }


        tableBody.innerHTML = "";


        bookings.forEach(
            booking => {


                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${booking.id ?? "-"}
                    </td>

                    <td>
                        ${booking.name ?? "-"}
                    </td>

                    <td>
                        ${booking.email ?? "-"}
                    </td>

                    <td>
                        ${booking.destination ?? "-"}
                    </td>

                    <td>
                        ${booking.travelDate ?? "-"}
                    </td>

                    <td>
                        ${booking.people ?? "-"}
                    </td>

                    <td>

                        <button
                            class="edit-btn"
                            onclick="editBooking(${booking.id})">

                            ✏️ Edit

                        </button>


                        <button
                            class="delete-btn"
                            onclick="deleteBooking(${booking.id})">

                            🗑️ Delete

                        </button>

                    </td>

                `;


                tableBody.appendChild(row);

            }
        );


    } catch (error) {


        console.error(
            "Booking loading error:",
            error
        );


        totalBookings.textContent =
            "0";


        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="error">

                    ❌ Unable to load bookings.

                    <br><br>

                    ${error.message}

                </td>

            </tr>

        `;

    }

}



/* =========================
   EDIT BOOKING
========================= */

function editBooking(id) {


    const booking =
        currentBookings.find(
            item => item.id === id
        );


    if (!booking) {

        alert(
            "Booking not found."
        );

        return;

    }


    document.getElementById(
        "editId"
    ).value =
        booking.id;


    document.getElementById(
        "editName"
    ).value =
        booking.name;


    document.getElementById(
        "editEmail"
    ).value =
        booking.email;


    document.getElementById(
        "editDestination"
    ).value =
        booking.destination;


    document.getElementById(
        "editTravelDate"
    ).value =
        booking.travelDate;


    document.getElementById(
        "editPeople"
    ).value =
        booking.people;


    document.getElementById(
        "editModal"
    ).style.display =
        "block";

}



/* =========================
   CLOSE MODAL
========================= */

function closeEditModal() {


    document.getElementById(
        "editModal"
    ).style.display =
        "none";

}



/* =========================
   SAVE EDIT
========================= */

document.getElementById(
    "editForm"
).addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        const id =
            document.getElementById(
                "editId"
            ).value;


        const bookingData = {

            name:
                document.getElementById(
                    "editName"
                ).value,

            email:
                document.getElementById(
                    "editEmail"
                ).value,

            destination:
                document.getElementById(
                    "editDestination"
                ).value,

            travelDate:
                document.getElementById(
                    "editTravelDate"
                ).value,

            people:
                document.getElementById(
                    "editPeople"
                ).value

        };


        try {


            const response =
                await fetch(
                    `${API_URL}/${id}`,
                    {

                        method: "PUT",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                bookingData
                            )

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Update failed"
                );

            }


            alert(
                "Booking updated successfully!"
            );


            closeEditModal();


            loadBookings();


        } catch (error) {


            console.error(
                "Update error:",
                error
            );


            alert(
                "Unable to update booking: " +
                error.message
            );

        }

    }
);



/* =========================
   DELETE BOOKING
========================= */

async function deleteBooking(id) {


    const confirmed =
        confirm(
            "Are you sure you want to delete this booking?"
        );


    if (!confirmed) {
        return;
    }


    try {


        const response =
            await fetch(
                `${API_URL}/${id}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Delete failed"
            );

        }


        alert(
            "Booking deleted successfully!"
        );


        loadBookings();


    } catch (error) {


        console.error(
            "Delete error:",
            error
        );


        alert(
            "Unable to delete booking: " +
            error.message
        );

    }

}



/* =========================
   START
========================= */

document.addEventListener(
    "DOMContentLoaded",
    loadBookings
);


</script>


</body>

</html>
